# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: azure-drift-detector

services:
  function:
    project: ./function
    language: python
    host: function

hooks:
  postprovision:
    shell: pwsh
    run: ./scripts/enable-static-website.ps1
    interactive: false
    continueOnError: false
